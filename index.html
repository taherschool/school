</style>

function V1(){
 if(form){if(!S.schools.length)return B('رجوع','tg()')+EM('سجّل مدرسة الأول','لازم يكون فيه مدرسة قبل إضافة العاملين.');
  return B('رجوع للقائمة','tg()')+`<div class="c f"><b>${ed?'تعديل بيانات موظف':'البيانات الشخصية'}</b>${F('b1','الاسم الكامل')}${G(F('b2','الرقم القومي','14 رقم'),F('b3','تاريخ الميلاد','1990/01/01'))}${G(SL('b4','النوع',A2(['ذكر','أنثى'])),SL('b5','الحالة الاجتماعية',A2(['أعزب','متزوج','أخرى'])))}${G(F('b6','التليفون','01012345678'),F('b7','العنوان'))}<b>البيانات الوظيفية</b>${G(SL('b8','الوظيفة',A2(JB)),SL('b9','المدرسة',SO()))}${G(F('c1','تاريخ التعيين','2020/09/01'),F('c2','الدرجة الوظيفية'))}${F('c3','رقم التأمينات')}<b>المؤهل</b>${G(F('c4','المؤهل','بكالوريوس'),F('c5','التخصص'))}${F('c6','دورات وملاحظات')}${B('حفظ بيانات الموظف','addF()',1)}</div>`}
 return B('إضافة موظف','tg()',1)+`<input placeholder="ابحث بالاسم" value="${E(q)}" oninput="setQ(this.value)" style="margin-bottom:12px"><div id="sl"></div>`;
}
function LS(){const el=$('sl');if(!el)return;const L=S.staff.filter(x=>!q||String(x.n).includes(q));
 el.innerHTML=L.length?L.map(x=>{const o=op===x.id;return `<div class="c"><div class="r pt" onclick="setOp('${o?'':x.id}')"><div class="av">${E(String(x.n)[0])}</div><div class="fl"><p class="nm">${E(x.n)}</p><p class="mu">${E(x.j)} · ${E(sch(x.s).n)}</p></div></div>${o?`<div class="dt">${[['الرقم القومي',x.nid],['التليفون',x.ph],['العنوان',x.ad],['تاريخ الميلاد',x.bd],['النوع',x.gn],['الحالة الاجتماعية',x.ms],['تاريخ التعيين',x.hd],['الدرجة',x.dg],['التأمينات',x.ins],['المؤهل',x.q],['التخصص',x.mj],['ملاحظات',x.nt]].map(([a,b])=>`<div><span>${a}</span><span>${E(b||'—')}</span></div>`).join('')}</div><div class="ac"><button onclick="edit('staff','${x.id}')">تعديل</button>${adm()?`<button onclick="dl('staff','${x.id}')">${cf===x.id?'تأكيد الحذف؟':'حذف'}</button>`:''}</div>`:''}</div>`}).join(''):EM('لسه مفيش عاملين','سجّل أول موظف من زر الإضافة.')}
async function addF(){const n=v('b1');if(!n)return say('اكتب اسم الموظف');const o={n};Object.entries(FM.staff).forEach(([k,f])=>{if(f!=='n')o[f]=v(k)});
 if(await(ed?upd('staff',ed.id,o):add('staff',o))){form=false;ed=null;pop()}render()}
function V2(){
 if(!S.schools.length)return EM('سجّل مدرسة الأول','بيانات الفصول والمرافق بتتسجل لكل مدرسة.');
 if(!S.schools.some(s=>s.id===fSc))fSc=S.schools[0].id;const L=S.fac.filter(x=>x.s===fSc);
 return (adm()?`<label>المدرسة</label><select onchange="setFSc(this.value)" style="margin-bottom:12px">${S.schools.map(s=>`<option value="${E(s.id)}"${s.id===fSc?' selected':''}>${E(s.n)}</option>`).join('')}</select>`:'')+`<div class="c f">${G(SL('d1','نوع البيان',A2(FT)),F('d2','العدد','1'))}${F('d3','ملاحظات','اختياري')}${B('إضافة بيان','addFa()',1)}</div>`+(L.length?L.map(x=>`<div class="c r"><div class="fl"><p class="nm">${E(x.t)}</p><p class="mu">${E(x.nt||'بدون ملاحظات')}</p></div><b style="font:700 24px 'Reem Kufi'">${E(x.c)}</b>${adm()?`<button onclick="dl('fac','${x.id}')">${cf===x.id?'تأكيد؟':'حذف'}</button>`:''}</div>`).join(''):EM('لسه مفيش بيانات للمدرسة دي','سجّل الفصول والمعامل والملاعب وأي مرفق.'));
}
async function addFa(){const c=parseInt(v('d2'));if(!c)return say('اكتب العدد');if(await add('fac',{s:fSc,t:v('d1'),c,nt:v('d3')}))pop();render()}
function V3(){
 const L=S.vis.filter(x=>x.d===day()).sort((a,b)=>b.i-a.i),n=L.filter(x=>!x.o).length;
 let h=`<div class="g2" style="margin-bottom:12px">${[['زوار اليوم',L.length],['لسه جوه المدرسة',n]].map(([a,b])=>`<div class="k c" style="margin:0"><b>${b}</b><span>${a}</span></div>`).join('')}</div>`+B(form?'إغلاق النموذج':'تسجيل زائر','tg()',!form);
 if(form)h+=S.schools.length?`<div class="c f">${F('e1','اسم الزائر')}${F('e2','الوظيفة','مفتش، ولي أمر، مورد')}${F('e4','الغرض من الزيارة')}${SL('e5','المدرسة',SO())}<p class="mu">وقت الدخول بيتسجل تلقائي.</p>${B('تسجيل دخول','addV()',1)}</div>`:EM('سجّل مدرسة الأول','الزيارة بتتسجل على مدرسة.');
 return h+(L.length?L.map(x=>`<div class="c"><div class="r"><p class="nm fl">${E(x.n)}</p><span class="mu ${x.o?'':'in'}">${x.o?'خرج '+tm(x.o):'<i class="dot"></i>جوه المدرسة'}</span></div><p class="mu">${E(x.j)} · ${E(x.why)}</p><p class="mu">${E(sch(x.s).n)} · دخل ${tm(x.i)}</p><div class="ac">${x.o?'':`<button onclick="outV('${x.id}')">تسجيل خروج</button>`}${adm()?`<button onclick="dl('vis','${x.id}')">${cf===x.id?'تأكيد الحذف؟':'حذف'}</button>`:''}</div></div>`).join(''):EM('مفيش زوار النهارده','سجّل أول زيارة من الزر فوق.'));
}
async function addV(){const n=v('e1');if(!n)return say('اكتب اسم الزائر');if(await add('vis',{n,j:v('e2')||'—',why:v('e4')||'—',s:v('e5'),i:Date.now(),o:0,d:day()})){form=false;pop()}render()}
async function outV(id){await upd('vis',id,{o:Date.now()})}
function V4(){
 const n=[0,1,2].map(i=>S.schools.filter(s=>s.st===i).length),T=n[0]+n[1]+n[2],a=T?n[0]/T*100:0,b=a+(T?n[1]/T*100:0),L=S.vis.filter(x=>x.d===day());
 const D=[...Array(7)].map((_,i)=>{const t=new Date(Date.now()-(6-i)*864e5);return[t.toLocaleDateString('en-CA'),t.toLocaleDateString('ar-EG',{weekday:'short'})]}),C=D.map(([k])=>S.vis.filter(x=>x.d===k).length),M=Math.max(1,...C);
 return `<div class="c r"><div class="dn" style="background:${T?`conic-gradient(var(--s0) 0 ${a}%,var(--s1) ${a}% ${b}%,var(--s2) ${b}% 100%)`:'var(--ln)'}"><div>${T}</div></div><div class="fl"><p class="nm">المدارس حسب المرحلة</p>${ST.map((x,i)=>`<p class="lg"><i style="background:var(--s${i})"></i>${x}<b>${n[i]}</b></p>`).join('')}</div></div><div class="c"><p class="nm">الزوار آخر 7 أيام</p><div class="bars">${D.map(([k,w],i)=>`<div><em>${C[i]}</em><i style="height:${Math.max(4,C[i]/M*70)}px;${i===6?'background:var(--s0)':''}"></i><span>${w}</span></div>`).join('')}</div></div>`+S.schools.map(s=>`<div class="c sc" style="--rb:var(--s${s.st})"><p class="nm">${E(s.n)}</p>${bt(s)}<div class="g3">${[['عاملين',S.staff.filter(x=>x.s===s.id).length],['زوار اليوم',L.filter(x=>x.s===s.id).length],['مرافق',S.fac.filter(x=>x.s===s.id).length]].map(([x,y])=>`<div class="k"><b>${y}</b><span>${x}</span></div>`).join('')}</div></div>`).join('')+`<div class="g2"><button onclick="ex('staff')">تصدير العاملين</button><button onclick="ex('visitors')">تصدير الزوار</button></div>`;
}
function ex(k){const R=k==='staff'?[['الاسم','الرقم القومي','الوظيفة','المدرسة','التليفون','تاريخ التعيين','المؤهل'],...S.staff.map(x=>[x.n,x.nid,x.j,sch(x.s).n,x.ph,x.hd,x.q])]:[['الزائر','الوظيفة','الغرض','المدرسة','اليوم','دخول','خروج'],...S.vis.map(x=>[x.n,x.j,x.why,sch(x.s).n,x.d,tm(x.i),x.o?tm(x.o):''])];
 const csv='\ufeff'+R.map(r=>r.map(c=>'"'+String(c??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=k+'.csv';a.click()}
function V5(){
 if(!adm())return '';
 return (nc?`<div class="c f" style="border-color:var(--s1)"><b>بيانات دخول ${E(nc.n)}</b><p class="mu">${E(nc.sc)}</p><p class="nm" dir="ltr" style="letter-spacing:2px">${E(nc.un)} / ${E(nc.pin)}</p><p class="mu">اكتبها دلوقتي، الرقم السري مش هيظهر تاني.</p><button onclick="dm()">تم</button></div>`:'')+`<p class="nm">قائمة أسماء المدارس</p><div class="c f"><div><label>اكتب أو الصق اسم كل مدرسة في سطر</label><textarea id="g1" rows="5"></textarea></div>${G(SL('g2','المرحلة',AR(ST)),SL('g3','النوع',AR(TY)))}${B('إضافة المدارس للقائمة','addList()',1)}<p class="mu">المدارس المسجلة: ${S.schools.length}</p></div><p class="nm">مسؤولو المدارس</p>`+S.mgrs.map(m=>`<div class="c r"><div class="fl"><p class="nm">${E(m.n)}</p><p class="mu">${E(sch(m.sid).n)} · <span dir="ltr">${E(m.un)}</span></p></div><button onclick="dl('mgrs','${m.id}')">${cf===m.id?'تأكيد الإلغاء؟':'إلغاء الصلاحية'}</button></div>`).join('')+(S.schools.length?`<div class="c f">${F('g4','اسم المسؤول','أ. منى')}${SL('g5','المدرسة',SO())}${B('إنشاء حساب مسؤول','addM()',1)}</div>`:EM('سجّل مدارس الأول','بعدها تقدر تعمل حساب لكل مسؤول.'));
}
async function addList(){const L=[...new Set($('g1').value.split('\n').map(x=>x.trim()).filter(Boolean))].filter(n=>!S.schools.some(s=>s.n===n));if(!L.length)return say('اكتب اسم مدرسة جديدة على الأقل');const st=+v('g2'),ty=+v('g3');let k=0;for(const n of L)if(await add('schools',{n,st,ty,stu:0,cls:0}))k++;say('تمت إضافة '+k+' مدرسة');if(k)pop()}
async function addM(){const n=v('g4'),sid=v('g5');if(!n)return say('اكتب اسم المسؤول');const u='m'+Math.floor(1000+Math.random()*9000),pin=String(Math.floor(100000+Math.random()*900000));
 try{const sec=initializeApp(CFG,'s'+Date.now()),a=getAuth(sec),c=await createUserWithEmailAndPassword(a,em(u),pin);await setDoc(doc(db,'users',c.user.uid),{role:'manager',sid,n,un:u});await signOut(a);nc={n,un:u,pin,sc:sch(sid).n};pop();render()}catch(e){say(err(e))}}
async function login(){const u=v('lu'),p=v('lp');if(!u||!p)return say('اكتب اسم المستخدم والرقم السري');try{await signInWithEmailAndPassword(auth,em(u),p)}catch(e){say(err(e))}}
async function setup(){const u=v('lu'),p=v('lp');if(!u||p.length<6)return say('اكتب اسم مستخدم ورقم سري 6 أرقام أو أكتر');busy=1;
 try{const c=await createUserWithEmailAndPassword(auth,em(u),p);await setDoc(doc(db,'users',c.user.uid),{role:'admin',n:'المدير',un:u});await setDoc(doc(db,'meta','setup'),{t:Date.now()});busy=0;await boot(c.user)}catch(e){busy=0;say(err(e))}}
async function boot(u){try{const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){say('الحساب ده مش مفعل');await signOut(auth);return}me={id:u.uid,...s.data()};sub();ready=1;anim();render()}catch(e){say(err(e));await signOut(auth)}}
function sub(){un.forEach(f=>f());un=[];const a=adm(),w=c=>a?collection(db,c):query(collection(db,c),where('s','==',me.sid));
 const on=(k,ref,one)=>un.push(onSnapshot(ref,sn=>{S[k]=one?(sn.exists()?[{id:sn.id,...sn.data()}]:[]):sn.docs.map(d=>({id:d.id,...d.data()}));rr()},e=>say(err(e))));
 on('schools',a?collection(db,'schools'):doc(db,'schools',me.sid),!a);on('staff',w('staff'));on('fac',w('facilities'));on('vis',w('visitors'));
 if(a)on('mgrs',query(collection(db,'users'),where('role','==','manager')))}
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function rr(){if(typing()){pend=1;return}render()}
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>{if(!typing()){pend=0;render()}},450)});
Object.assign(window,{nav,tg,setFS,setFSc,setOp,setQ,dm,edit,out,render,dl,addS,addF,addFa,addV,outV,ex,addList,addM,login,setup});
render();
if(!CFG.apiKey.startsWith('PASTE')){app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
 onAuthStateChanged(auth,async u=>{if(busy)return;if(!u){me=null;un.forEach(f=>f());un=[];try{setupDone=!!(await getDoc(doc(db,'meta','setup'))).exists()}catch(e){setupDone=true}ready=1;render();return}await boot(u)})}
</script>
